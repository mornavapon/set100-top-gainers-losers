name: SET100 Top Gainers & Losers

on:
  schedule:
    # 12:50 and 17:50 Thailand time (UTC+7), Monday-Friday
    - cron: "50 5,10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to run"
        required: true
        type: choice
        options:
          - alert
          - test-ntfy
          - check-data
        default: alert

permissions:
  contents: read

jobs:
  set100-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SET100 alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'alert' }}"
          python scripts/set100_alert.py "$MODE"
