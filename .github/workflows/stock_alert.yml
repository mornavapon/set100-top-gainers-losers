name: SET100 Stock Alert

on:
  schedule:
    # 12:50 น. และ 17:50 น. ของวันจันทร์ - ศุกร์ (เวลาไทย ICT = UTC+7)
    # 12:50 ICT = 05:50 UTC | 17:50 ICT = 10:50 UTC
    - cron: '50 5,10 * * 1-5'
  
  # เพิ่มปุ่มกดรันเองในหน้า GitHub Actions (สำหรับกด Test)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run connection test to ntfy?'
        required: true
        type: boolean
        default: false

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Alert Script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python script.py
